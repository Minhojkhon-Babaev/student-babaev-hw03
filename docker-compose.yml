name: hse-pg-hw03-verified

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-token=hw03
      - --initial-cluster-state=new
    volumes:
      - etcd_data:/etcd-data
    restart: "no"

  node1:
    build: ./docker/patroni
    cpus: 1.0
    mem_limit: 768m
    hostname: node1
    environment:
      PATRONI_NAME: node1
      PATRONI_CONNECT_ADDRESS: node1:5432
    depends_on:
      - etcd
    ports:
      - "127.0.0.1:5435:5432"
      - "127.0.0.1:8018:8008"
    volumes:
      - node1_data:/var/lib/postgresql/data
    restart: "no"

  node2:
    build: ./docker/patroni
    cpus: 1.0
    mem_limit: 768m
    hostname: node2
    environment:
      PATRONI_NAME: node2
      PATRONI_CONNECT_ADDRESS: node2:5432
    depends_on:
      - etcd
    ports:
      - "127.0.0.1:5436:5432"
      - "127.0.0.1:8019:8008"
    volumes:
      - node2_data:/var/lib/postgresql/data
    restart: "no"

  haproxy:
    image: haproxy:2.9.15-alpine
    depends_on:
      - node1
      - node2
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:5001:5001"
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: "no"

volumes:
  etcd_data:
  node1_data:
  node2_data:
