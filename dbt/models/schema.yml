version: 2

models:
  - name: stg_weather_hourly
    description: ODS. Часовые наблюдения после разбора типов и дедупа (city_id, observed_at).
    columns:
      - name: city_id
        tests: [not_null]
      - name: observed_at
        tests: [not_null]
      - name: temperature_2m_c
        tests: [not_null]

  - name: stg_city
    description: ODS. Версии справочника городов.
    columns:
      - name: city_id
        tests: [not_null]
      - name: federal_district
        tests:
          - not_null
          - accepted_values:
              values: ['Центральный', 'Южный', 'Дальневосточный', 'ТЕСТОВЫЙ_ОКРУГ']

  - name: dim_city
    description: DDS. SCD2-измерение города.
    columns:
      - name: city_sk
        tests: [not_null, unique]
      - name: city_id
        tests: [not_null]

  - name: dim_date
    columns:
      - name: date_key
        tests: [not_null, unique]

  - name: fact_weather_hourly
    description: DDS. Факт. Гранулярность — час UTC × город.
    columns:
      - name: city_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_city')
              field: city_sk
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: observed_at
        tests: [not_null]

  - name: weather_daily_candidate
    description: Кандидат витрины день × город. Не публикуется без тестов.
    columns:
      - name: city_id
        tests: [not_null]
      - name: observed_date
        tests: [not_null]
      - name: n_hours
        tests: [not_null]
